<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>File Audio - Agenzia Bassanese SAS</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    body {
      background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
      min-height: 100vh;
      padding-top: 100px;
    }

    .audio-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .page-title {
      color: #8B0000;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }

    .page-subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .audio-item {
      background: linear-gradient(135deg, #ffe6e6 0%, #ffcccc 100%);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .audio-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(139, 0, 0, 0.2);
    }

    .audio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .audio-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 15px;
      padding-right: 15px;
    }

    .audio-icon {
      background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .audio-name {
      font-weight: 600;
      color: #333;
      font-size: 1.1rem;
      margin: 0;
    }

    .audio-size {
      color: #666;
      font-size: 0.9rem;
      margin: 0;
    }

    .download-btn {
      background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
      color: white;
    }

    .audio-player {
      width: 100%;
      margin-top: 10px;
      outline: none;
    }

    .audio-player::-webkit-media-controls-panel {
      background: linear-gradient(135deg, #8B0000 0%, #5C0000 100%);
    }

    .audio-player::-webkit-media-controls-play-button,
    .audio-player::-webkit-media-controls-mute-button {
      filter: invert(1);
    }

    .audio-player::-webkit-media-controls-current-time-display,
    .audio-player::-webkit-media-controls-time-remaining-display {
      color: white;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #333;
    }

    .speed-control label {
      font-weight: 600;
      color: #8B0000;
      margin: 0;
    }

    .speed-select {
      padding: 5px 10px;
      border: 2px solid #8B0000;
      border-radius: 8px;
      background: white;
      color: #8B0000;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
    }

    .speed-select:hover {
      background: #ffe6e6;
    }

    .speed-select:focus {
      box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
    }

    .no-files {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .no-files i {
      font-size: 4rem;
      color: #8B0000;
      margin-bottom: 20px;
    }

    .back-home {
      text-align: center;
      margin-top: 30px;
    }

    .back-home a {
      color: #8B0000;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-home a:hover {
      color: #5C0000;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .audio-container {
        padding: 20px;
        margin: 0 15px;
      }

      .page-title {
        font-size: 2rem;
      }

      .audio-header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }

      .audio-info {
        width: 100%;
      }

      .download-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="audio-container">
    <h1 class="page-title">
      <i class="fas fa-music me-2"></i>File Audio
    </h1>
    <p class="page-subtitle">Ascolta e scarica i file audio disponibili</p>

    <div id="audio-list">
      <!-- I file audio verranno caricati dinamicamente -->
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    async function loadAudioFiles() {
      const audioList = document.getElementById('audio-list');

      // Mostra un messaggio di caricamento
      audioList.innerHTML = `
        <div class="no-files">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Caricamento...</p>
        </div>
      `;

      try {
        const response = await fetch('get-audio-files.asp');
        const audioFiles = await response.json();

        if (audioFiles.length === 0) {
          audioList.innerHTML = `
            <div class="no-files">
              <i class="fas fa-folder-open"></i>
              <h3>Nessun file audio disponibile</h3>
              <p>Al momento non ci sono file audio da scaricare.</p>
            </div>
          `;
          return;
        }

        audioList.innerHTML = audioFiles.map((file, index) => `
          <div class="audio-item">
            <div class="audio-header">
              <div class="audio-info">
                <div class="audio-icon">
                  <i class="fas fa-file-audio"></i>
                </div>
                <div>
                  <p class="audio-name">${file.name}</p>
                  <p class="audio-size">${file.size}</p>
                </div>
              </div>
              <a href="media/${file.name}" class="download-btn" download>
                <i class="fas fa-download"></i>
                Download
              </a>
            </div>
            <audio controls class="audio-player" id="audio-${index}" preload="metadata">
              <source src="media/${file.name}" type="audio/mpeg">
              Il tuo browser non supporta l'elemento audio.
            </audio>
            <div class="audio-controls">
              <div class="speed-control">
                <label for="speed-${index}"><i class="fas fa-gauge-high"></i> Velocità:</label>
                <select id="speed-${index}" class="speed-select" onchange="changeSpeed(${index}, this.value)">
                  <option value="0.5">0.5x</option>
                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1x (Normale)</option>
                  <option value="1.25">1.25x</option>
                  <option value="1.5">1.5x</option>
                  <option value="1.75">1.75x</option>
                  <option value="2">2x</option>
                </select>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        audioList.innerHTML = `
          <div class="no-files">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Errore nel caricamento</h3>
            <p>Si è verificato un errore nel caricamento dei file audio.</p>
          </div>
        `;
        console.error('Errore:', error);
      }
    }

    // Funzione per cambiare la velocità di riproduzione
    function changeSpeed(audioIndex, speed) {
      const audio = document.getElementById(`audio-${audioIndex}`);
      if (audio) {
        audio.playbackRate = parseFloat(speed);
      }
    }

    // Carica i file all'avvio della pagina
    loadAudioFiles();
  </script>
</body>

</html>
